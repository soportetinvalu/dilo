name: Dilo macOS Apple Silicon

# RAMA TEMPORAL prueba-privada/*: este archivo sustituye al CI público solo en esta rama.
# Únicamente workflow_dispatch del propietario. Sin artefactos, sin caché, sin texto en el registro.
# Entrada: borrador de release (solo visible con push) + clave temporal en secreto del repo.
# Salida: cifrada hacia una clave X25519 cuya parte privada nunca sale del VPS.
on:
  workflow_dispatch:
    inputs:
      release_id:
        description: 'ID del borrador privado de transporte'
        required: true
        type: string
      return_pubkey:
        description: 'Clave pública X25519 de devolución (base64, 32 bytes)'
        required: true
        type: string
      rounds:
        description: 'Rondas: ficticio | ficticio real'
        required: true
        type: choice
        options: ['ficticio', 'ficticio real']

permissions:
  contents: read

concurrency:
  group: dilo-privado
  cancel-in-progress: false

jobs:
  privado:
    if: github.repository == 'soportetinvalu/dilo' && github.event_name == 'workflow_dispatch' && github.actor == 'soportetinvalu' && startsWith(github.ref, 'refs/heads/prueba-privada/')
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      # Solo para leer/subir assets del borrador. El helper que maneja audio no recibe el token.
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: '14.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validar entradas y plataforma
        env:
          RELEASE_ID: ${{ inputs.release_id }}
          RETURN_PUBKEY: ${{ inputs.return_pubkey }}
          ROUNDS: ${{ inputs.rounds }}
        run: |
          set -euo pipefail
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          [[ "$RELEASE_ID" =~ ^[0-9]{1,15}$ ]]
          [[ "$RETURN_PUBKEY" =~ ^[A-Za-z0-9+/]{43}=$ ]]
          [[ "$ROUNDS" == "ficticio" || "$ROUNDS" == "ficticio real" ]]
          { sw_vers; uname -m; xcodebuild -version; swift --version; }
          umask 077
          mkdir -m 700 "$RUNNER_TEMP/privado" "$RUNNER_TEMP/privado-home"
      - name: Compilar helper privado separado (no toca la app ni DiloModelCheck)
        run: |
          set -euo pipefail
          cd Tools/DiloPrivateCheck
          swift build -c release 2>&1 | tail -n 20
          test -x "$(swift build -c release --show-bin-path)/DiloPrivateCheck"
      - name: Descargar modelo fijado y comprobar hashes
        run: |
          set -euo pipefail
          python3 scripts/download-model.py "$RUNNER_TEMP/ParakeetV3" > "$RUNNER_TEMP/model-download.json"
          echo "modelo verificado: $(wc -c < "$RUNNER_TEMP/model-download.json") bytes de informe"
      - name: Recibir entradas cifradas del borrador privado
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          ROUNDS: ${{ inputs.rounds }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2086
          python3 Tools/DiloPrivateCheck/transfer.py download "$RELEASE_ID" "$RUNNER_TEMP/privado" $ROUNDS
      - name: Descifrar en memoria, transcribir y cifrar devolución
        env:
          DILO_PRIVADO_K_IN: ${{ secrets.DILO_PRIVADO_K_IN }}
          DILO_RETURN_PUBKEY: ${{ inputs.return_pubkey }}
          ROUNDS: ${{ inputs.rounds }}
        run: |
          set -euo pipefail
          BIN="$(cd Tools/DiloPrivateCheck && swift build -c release --show-bin-path)/DiloPrivateCheck"
          P="$RUNNER_TEMP/privado"
          set +e
          # shellcheck disable=SC2086
          HOME="$RUNNER_TEMP/privado-home" "$BIN" transcribe "$RUNNER_TEMP/ParakeetV3" "$GITHUB_RUN_ID" "$P" $ROUNDS > "$P/helper.log" 2>&1
          rc=$?
          set -e
          echo "helper RC=$rc; líneas de registro privado=$(wc -l < "$P/helper.log")"
          # El registro puede contener mensajes de FluidAudio: vuelve cifrado, nunca al log público.
          DILO_PRIVADO_K_IN='' HOME="$RUNNER_TEMP/privado-home" "$BIN" seal diag "$GITHUB_RUN_ID" "$P/helper.log" "$P/diag.enc"
          rm -f "$P/helper.log" "$P"/entrada-*.enc
          exit "$rc"
      - name: Devolver resultados cifrados al borrador
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
        run: |
          set -euo pipefail
          test -d "$RUNNER_TEMP/privado" || exit 0
          python3 Tools/DiloPrivateCheck/transfer.py upload "$RELEASE_ID" "$GITHUB_RUN_ID" "$RUNNER_TEMP/privado"
      - name: Limpiar temporales privados del runner
        if: always()
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/privado" "$RUNNER_TEMP/privado-home"
          test ! -e "$RUNNER_TEMP/privado" && test ! -e "$RUNNER_TEMP/privado-home"
          echo "temporales privados eliminados"
